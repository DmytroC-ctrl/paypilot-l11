# Список мутантів L11 (крок 2 лабораторної).
#
# 1. Скопіюйте цей файл у mutants.toml.
# 2. Впишіть 12 мутантів, по три на кожен клас:
#      значення тіру · межа EUR 1 000 · арифметика · форма результату
#    Поле class пишіть саме так, дослівно: "значення тіру", "межа EUR 1 000",
#    "арифметика", "форма результату" — скрипт групує мутантів за цим рядком.
# 3. Закомітьте mutants.toml ДО першого прогону:
#      git add mutants.toml && git commit -m "L11: список мутантів"
#    (Windows PowerShell: git add mutants.toml; git commit -m "L11: список мутантів")
#    Після цього список не змінюється.
#
# Кожен мутант — одна маленька зміна в коді:
#   id       — A-01…A-03, B-01…B-03, C-01…C-03, D-01…D-03
#   class    — назва класу
#   file     — файл, у якому міняємо (app/engines/fx.py або app/engines/policy.py)
#   find     — рядок коду дослівно, як у файлі (з пробілами); має зустрічатися рівно 1 раз
#   replace  — на що міняємо
#   description — що зламано, людською мовою
#
# Якщо в рядку є лапки, беріть інші лапки навколо: find = '"tier2": 0.9'
# Перевірка, що список застосовується: python tools/run_mutants.py --check

[[mutant]]
id = "A-01"
class = "значення тіру"
file = "app/engines/policy.py"
find = '"tier2": 0.9'
replace = '"tier2": 1.5'
description = "клієнт tier2 платить 1.5 % замість 0.9 % (наслідок як у дефекту D20)"

[[mutant]]
id = "A-02"
class = "значення тіру"
file = "app/engines/policy.py"
find = '"tier3": 0.5'
replace = '"tier3": 0.9'
description = "клієнт tier3 платить спред 0.9 % замість 0.5 %"

[[mutant]]
id = "A-03"
class = "значення тіру"
file = "app/engines/policy.py"
find = '"tier1": 500,'
replace = '"tier1": 5000,'
description = "безкоштовний місячний ліміт tier1 EUR 5 000 замість EUR 500"

[[mutant]]
id = "B-01"
class = "межа EUR 1 000"
file = "app/engines/fx.py"
find = 'amount_eur <= allowance_total'
replace = 'amount_eur < allowance_total'
description = "рівно на межі ліміту (<= → <) безкоштовна конвертація стає платною"

[[mutant]]
id = "B-02"
class = "межа EUR 1 000"
file = "app/engines/policy.py"
find = '"tier2": 1000'
replace = '"tier2": 999'
description = "безкоштовний ліміт tier2 EUR 999 замість EUR 1 000"

[[mutant]]
id = "B-03"
class = "межа EUR 1 000"
file = "app/engines/fx.py"
find = 'within = allowance_used_eur + amount_eur <='
replace = 'within = amount_eur <='
description = "ліміт не враховує вже використане за місяць: порівнюється лише сума поточної операції"

[[mutant]]
id = "C-01"
class = "арифметика"
file = "app/engines/fx.py"
find = 'policy.RATES_TO_EUR[from_currency] / policy.RATES_TO_EUR[to_currency]'
replace = 'policy.RATES_TO_EUR[to_currency] / policy.RATES_TO_EUR[from_currency]'
description = "курс обернено: from/to міняються місцями"

[[mutant]]
id = "C-02"
class = "арифметика"
file = "app/engines/fx.py"
find = 'final_amount=gross - spread_amount'
replace = 'final_amount=gross + spread_amount'
description = "спред додається до суми замість віднімання"

[[mutant]]
id = "C-03"
class = "арифметика"
file = "app/engines/fx.py"
find = 'charged_eur = max(0.0, amount_eur - remaining_eur)'
replace = 'charged_eur = max(0.0, amount_eur - allowance_total)'
description = "частковий ліміт: надлишок рахується від повного ліміту, а не від залишку"

[[mutant]]
id = "D-01"
class = "форма результату"
file = "app/engines/fx.py"
find = 'round(v, 6)'
replace = 'round(v, 2)'
description = "as_dict() округлює до 2 знаків замість 6"

[[mutant]]
id = "D-02"
class = "форма результату"
file = "app/engines/fx.py"
find = '(round(v, 6) if isinstance(v, float) else v)'
replace = '(str(round(v, 6)) if isinstance(v, float) else v)'
description = "as_dict() повертає дробові значення рядком замість числа"

[[mutant]]
id = "D-03"
class = "форма результату"
file = "app/engines/fx.py"
find = 'allowance_applied=within,'
replace = 'allowance_applied=not within,'
description = "поле allowance_applied у котируванні інвертовано"
